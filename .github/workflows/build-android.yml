name: Build Android from source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Fetch matching native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: JNI_DIR="$PWD/toolchains/out/jniLibs" native/prebuilt.sh fetch
      - name: Build engine from lockfile
        run: js/build-engine.sh
      - name: Build APK and validate release configuration
        run: |
          ./gradlew :app:assembleRelease -Pdsh.nativeOut=../toolchains/out/jniLibs -Pdsh.engineOut=../toolchains/out/engine --stacktrace
          python3 tools/check-russian-resources.py
          python3 tools/check-update-config.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-android-build
          path: |
            app/build/outputs/apk/release/*.apk
            toolchains/out/engine/engine-version.txt
            toolchains/out/engine/engine.sha256
          if-no-files-found: error
